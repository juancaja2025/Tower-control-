<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>



<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torre de Control OCASA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<script src="assets/ar_provincias.js"></script>
<script src="assets/amba_partidos.js"></script>
<script src="assets/ar_departamentos.js"></script>
<style>
html[data-theme="dark"]{
  --bg:#0A1215;--surf:#101B1F;--hov:#16262B;--hov2:#1C3035;--bd:#21363C;--bd2:#2F4A51;--rowb:#16252A;
  --t1:#EEF2F3;--t2:#9FB1B5;--t3:#5F767B;
  --crit:#EF4444;--risk:#FFAB40;--warn:#E8CE48;--act:#1AB3C2;--stale:#A78BFA;--ok:#8FBF4C;
  --band1:#23393F;--band2:#1A2D32;--band3:#132226;--sea:#0C171A;--land:#1A2C31;--nb:#122024;--line:#3F5D64;--grid:#172529;
  --scrim:rgba(4,9,11,.72);--brand:#0099A8;--brandt:#FFFFFF;--hi:rgba(0,153,168,.16);
}
html[data-theme="light"]{
  --bg:#EFEFEF;--surf:#FFFFFF;--hov:#F1F6F7;--hov2:#E3EEF0;--bd:#D9DEE0;--bd2:#B9C3C6;--rowb:#EEF1F2;
  --t1:#0E1214;--t2:#4E595D;--t3:#8C979B;
  --crit:#D32F2F;--risk:#C46F00;--warn:#9A7B00;--act:#007C88;--stale:#6F4FD1;--ok:#4F7F1C;
  --band1:#CFD6D9;--band2:#DFE5E7;--band3:#EEF1F2;--sea:#F7F9F9;--land:#E2E8EA;--nb:#EEF1F1;--line:#A3B0B4;--grid:#EDF0F1;
  --scrim:rgba(14,18,20,.32);--brand:#0099A8;--brandt:#FFFFFF;--hi:rgba(0,153,168,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{color:var(--t1);font-family:'Montserrat',system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--act)} a:hover{color:var(--t1)}
button,select{font-family:inherit}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 36px minmax(0,1fr);gap:8px;padding:0 12px 12px;overflow:hidden;background:var(--bg)}
.s-ok{--sc:var(--t2)} .s-crit{--sc:var(--crit)} .s-risk{--sc:var(--risk)} .s-warn{--sc:var(--warn)} .s-act{--sc:var(--act)} .s-stale{--sc:var(--stale)}
.sc{color:var(--sc)}
.stripes{background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--stale) 14%,transparent) 0 6px,transparent 6px 12px)}

.chrome{margin:0 -12px;background:var(--surf);border-bottom:1px solid var(--bd)}
.top{height:58px;padding:0 18px;display:flex;align-items:center;gap:24px;white-space:nowrap}
.brand{display:flex;align-items:center;gap:16px}
.brand img{height:28px;display:block}
.brand .bt{border-left:1px solid var(--bd);padding-left:16px}
.brand h1{margin:0;font-size:38px;font-weight:700;line-height:28px;letter-spacing:-.01em;white-space:nowrap}
.brand p{margin:0;font-size:14px;color:var(--t2)}
.clock{font-size:20px;font-weight:600;margin-left:12px}
.clock span{color:var(--t2);font-size:14px;font-weight:500;margin-right:10px}
.alerts{display:flex;gap:8px;margin-left:auto}
.chip{font-size:14px;padding:3px 8px;border:1px solid var(--bd);border-radius:3px;color:var(--t2)}
.chip b{color:var(--t1);font-weight:600}
.chip.stale{color:var(--stale);border-color:var(--stale)} .chip.stale b{color:var(--stale)}
.alerts .chip{font-size:15px;font-weight:700;padding:4px 10px}
.alerts .chip.on{border-color:var(--sc);color:var(--sc)}
.seg{display:flex;border:1px solid var(--bd);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;color:var(--t2);font-size:14px;font-weight:500;padding:0 12px;height:30px;cursor:pointer}
.seg button:hover{color:var(--t1)}
.seg button.on{background:var(--hov2);color:var(--t1);font-weight:700}
.seg button.on.contg{background:var(--crit);color:#fff}
@keyframes flash{0%{background:color-mix(in srgb,var(--crit) 45%,transparent)}100%{background:transparent}}
.flash{animation:flash .9s ease-out 2}

.tabs{height:46px;padding:0 10px 0 6px;display:flex;align-items:stretch;gap:16px;white-space:nowrap}
.rotador{display:flex;align-items:stretch}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--t2);font-size:16px;font-weight:600;padding:3px 18px 0;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--t1);background:var(--hov)}
.tab.on{color:var(--t1);border-bottom-color:var(--brand)}
.tab .tb{font-size:14px;font-weight:700;color:var(--sc)}
.tabs .tr{margin-left:auto;display:flex;align-items:center;gap:12px}
.cbar{height:36px;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--crit);color:#fff;font-size:15px;white-space:nowrap}
.cbar b{font-weight:700;letter-spacing:.04em}
.cbar .cx{opacity:.92}
.cbar .cr{margin-left:auto;display:flex;gap:8px}
.cbar button{height:26px;padding:0 12px;border:1px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:3px;font-size:14px;font-weight:600;cursor:pointer}
.cbar button:hover{background:rgba(255,255,255,.15)}
.cbar button.w{background:#fff;color:#B91C1C;border-color:#fff}

.fil{display:flex;align-items:center;gap:8px;white-space:nowrap}
.fchip{display:flex;align-items:center;gap:4px;height:32px;padding:0 6px 0 12px;border:1px solid var(--bd);border-radius:16px;font-size:14px;color:var(--t2);background:var(--surf)}
.fchip.on{border-color:var(--brand);background:var(--hi)}
.fchip select{background:transparent;color:var(--t1);border:0;font:inherit;font-weight:600;appearance:none;-webkit-appearance:none;cursor:pointer;padding:0 16px 0 2px;outline:none;background-image:linear-gradient(45deg,transparent 50%,var(--t2) 50%),linear-gradient(135deg,var(--t2) 50%,transparent 50%);background-position:calc(100% - 7px) 55%,calc(100% - 2px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.fchip select option{background:var(--surf);color:var(--t1)}
.lnk{background:none;border:0;color:var(--t2);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
.lnk:hover{color:var(--t1)}
.fil .spacer{flex:1}
.srcs{display:flex;gap:6px;align-items:center}
.srcs>span{font-size:14px;color:var(--t2);margin-right:2px}
.refresh{font-size:14px;color:var(--t2)} .refresh b{color:var(--t1);font-weight:600}
.seal{font-size:14px;color:var(--t2);border:1px dashed var(--bd2);padding:3px 8px;border-radius:3px;min-width:0;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.fil{min-width:0;overflow:hidden}
.tabs{min-width:0;overflow:hidden}
#cdSeg{flex-shrink:0}#cdSeg button{white-space:nowrap}
#fLay{max-width:230px;text-overflow:ellipsis;overflow:hidden}

/* grilla de 24 × 20: cada elemento de la pantalla es un widget con posición y tamaño propios */
#grid{position:relative;display:grid;grid-template-columns:repeat(24,minmax(0,1fr));grid-template-rows:repeat(20,minmax(0,1fr));gap:8px;min-height:0}
.w{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.wb{flex:1;min-height:0;display:flex;flex-direction:column}
.wb>*{flex:1;min-height:0}
.gcells{grid-area:1/1/-1/-1;display:none;grid-template-columns:repeat(24,minmax(0,1fr));grid-template-rows:repeat(20,minmax(0,1fr));gap:8px;pointer-events:none}
.gcells i{border:1px dashed var(--bd);border-radius:3px}
.wmask{display:none}
.editing .gcells{display:grid}
.editing .wmask{display:flex;position:absolute;inset:0;z-index:5;border:2px dashed var(--brand);border-radius:4px;background:color-mix(in srgb,var(--brand) 10%,transparent);cursor:grab;align-items:flex-start;justify-content:space-between;gap:6px;padding:6px;touch-action:none}
.editing .wmask:hover{background:color-mix(in srgb,var(--brand) 18%,transparent)}
.wmask .wn{background:var(--brand);color:#fff;font-size:13px;font-weight:700;padding:2px 8px;border-radius:3px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wmask .wx{flex-shrink:0;width:26px;height:26px;border:1px solid var(--bd2);border-radius:3px;background:var(--surf);color:var(--t1);font-size:13px;cursor:pointer;padding:0}
.wmask .wx:hover{border-color:var(--crit);color:var(--crit)}
.wmask .wr{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 52%,var(--brand) 52%);border-bottom-right-radius:3px}
.w.dragging{opacity:.35}
.editing .lane-fx,.editing .ping{animation:none;display:none}
.editing .w .wb{pointer-events:none}
.editing .ghost{will-change:grid-area}
.editing .wmask.sel{border-style:solid;border-width:3px;background:color-mix(in srgb,var(--brand) 22%,transparent)}
.wctl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:calc(100% - 16px);z-index:7}
.wctl button{min-width:44px;height:44px;padding:0 10px;border-radius:6px;border:1px solid var(--brand);background:var(--surf);color:var(--t1);font:inherit;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
.wctl button:active{background:var(--hi)}
@media (pointer:coarse){.editing .wmask .wr{width:48px;height:48px}.editing .wmask .wx{width:40px;height:40px;font-size:16px}.editing .wmask .wn{font-size:15px;padding:5px 10px}}
.ghost{z-index:6;border:2px solid var(--act);background:color-mix(in srgb,var(--act) 20%,transparent);border-radius:4px;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--t1);text-align:center;padding:6px}
.ghost.swap{border-style:dashed}
.ghost.bad{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 20%,transparent)}
.ebar{min-height:40px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:6px 18px;background:var(--hi);border-top:1px solid var(--brand);font-size:14px;color:var(--t2)}
.ebar>b{flex:none;white-space:nowrap}
.ebar>span{flex:1 1 360px;min-width:0;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ebar b{color:var(--t1)}
#fLay{max-width:210px;text-overflow:ellipsis}
.tabs .tr{flex:none;min-width:0}
.tabs .rotador{min-width:0;overflow:hidden}
.ebar .cr{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;flex:0 1 auto;max-width:100%}
.ebar .cr .btn{flex:none;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ebar .btn{height:30px}

.tile{background:var(--surf);border:1px solid var(--bd);border-radius:4px;padding:8px 12px;display:flex;flex-direction:column;gap:5px;cursor:pointer;min-width:0;overflow:hidden;container-type:size}
.tile:hover{background:var(--hov)}
.tile:not(.s-ok){border-color:var(--sc)}
.t-lbl{font-size:16px;color:var(--t2);font-weight:600;line-height:1.25;min-height:2.5em;text-wrap:balance}
.t-row{display:flex;align-items:flex-end;justify-content:space-between;gap:2px 8px;flex-wrap:wrap}
.t-val{font-size:46px;font-weight:700;line-height:.95;letter-spacing:-.03em;white-space:nowrap}
.t-val small{font-size:.42em;font-weight:500;color:var(--t2);letter-spacing:0;margin-left:3px}
.t-st{font-size:14px;font-weight:700;color:var(--sc);white-space:nowrap;padding-bottom:2px}
.t-spark{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;color:var(--t2);white-space:nowrap}
.t-meta{font-size:14px;color:var(--t2);line-height:1.25}
.t-meta b{color:var(--t1);font-weight:600}
.bul{position:relative;height:14px;background:var(--band3)}
.bul i{position:absolute;top:0;bottom:0}
.bul .bv{position:absolute;left:0;top:4px;height:6px;background:var(--t2)}
.tile:not(.s-ok) .bul .bv,.op:not(.s-ok) .bul .bv{background:var(--sc)}
.bul em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--t1)}
.stack{display:flex;height:14px;gap:2px}
.stack i{display:block;height:100%}
/* los indicadores se adaptan al tamaño que les dé la grilla */
@container (max-width:260px){.t-val{font-size:40px}.t-lbl{min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t-row{flex-wrap:nowrap}.t-st{overflow:hidden;text-overflow:ellipsis;min-width:0}}
@container (max-width:190px){.t-val{font-size:34px}.t-spark svg{display:none}}
@container (max-height:136px){.t-spark{display:none}}
@container (max-height:110px){.t-meta,.bul,.stack{display:none}.t-lbl{min-height:0}}

.panel{background:var(--surf);border:1px solid var(--bd);border-radius:4px;min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column;container-type:inline-size}
.pb{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
@container (max-width:400px){.op{grid-template-columns:minmax(0,1fr) 60px minmax(70px,1fr)}.op .st{display:none}.t5{grid-template-columns:18px minmax(0,1fr) 80px 56px}.ph>span{display:none}}
.ph{display:flex;align-items:center;gap:14px;padding:8px 12px 6px;font-size:14px;color:var(--t2);white-space:nowrap}
.ph h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t1)}
.ph .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.tog{background:none;border:1px solid var(--bd);color:var(--t2);font-size:14px;font-weight:500;height:28px;padding:0 10px;border-radius:4px;cursor:pointer}
.tog:hover{color:var(--t1)}
.tog.on{border-color:var(--brand);color:var(--t1);background:var(--hi)}

#mapbox{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%}
#map .nd{cursor:pointer}
/* troncales "en movimiento": un pulso salta de origen a destino; cuanto más grave el estado, más rápido */
.lane-fx{fill:none;stroke-linecap:round;stroke-dasharray:14 186;pointer-events:none;animation:hop var(--d) cubic-bezier(.7,0,.3,1) infinite;animation-delay:var(--dl)}
@keyframes hop{from{stroke-dashoffset:14}to{stroke-dashoffset:-100}}
.ping{fill:none;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:ping var(--d) ease-out infinite;animation-delay:var(--dl)}
@keyframes ping{0%,84%{transform:scale(.4);opacity:0}88%{opacity:.95}100%{transform:scale(2.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.lane-fx,.ping{animation:none;display:none}}
.legend{position:absolute;left:12px;top:4px;display:flex;flex-wrap:wrap;gap:2px 12px;max-width:calc(100% - 24px);font-size:14px;color:var(--t2);pointer-events:none}
.tblwrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent;overscroll-behavior:contain}
.tblwrap .tbl th{position:sticky;top:0;z-index:1;background:var(--surf)}
.tblwrap .tbl{flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{color:var(--t2);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);font-size:14px;white-space:nowrap}
.tbl td{padding:5px 8px;border-bottom:1px solid var(--rowb);color:var(--t2);white-space:nowrap}
.tbl tr[data-drill]{cursor:pointer}
.tbl tr[data-drill]:hover td{background:var(--hov)}
.tbl td.n{color:var(--t1);font-weight:500}
.tbl tr.ab td.n{font-weight:700}
.tbl td.num,.tbl th.num{text-align:right}
.tbl td.st{color:var(--sc);font-weight:600}
.tbl tr.ab td.st{font-weight:700}
.mbar{display:inline-block;width:64px;height:6px;background:var(--band2);vertical-align:middle;margin-right:8px;position:relative}
.mbar i{position:absolute;left:0;top:0;bottom:0;background:var(--t2)}
tr:not(.s-ok) .mbar i{background:var(--sc)}
.tnote{padding:6px 10px;font-size:14px;color:var(--t2)}

.mxwrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 10px 6px;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent;overscroll-behavior:contain}
.mxwrap .mx{flex:none}
.mxwrap .mx th{position:sticky;top:0;z-index:1;background:var(--surf)}
.mx{width:100%;border-collapse:separate;border-spacing:3px;font-size:14px;table-layout:fixed}
.mx th{font-weight:700;color:var(--t2);text-align:left;padding:4px 8px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-bottom:2px solid var(--bd)}
.mx th:hover{color:var(--t1);border-bottom-color:var(--brand)}
.mx th.rh{cursor:default;width:132px;border-bottom-color:transparent}
.mx th .tb{color:var(--sc);margin-left:6px}
.mx td{padding:0 6px;height:26px;border-radius:3px;background:var(--bg);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.mx td:hover{outline:1px solid var(--bd2)}
.mx td.rn{background:none;color:var(--t1);font-weight:600;cursor:pointer}
.mx td.rn small{color:var(--t2);font-weight:500;margin-left:6px}
.mx td.al{background:color-mix(in srgb,var(--sc) 18%,var(--surf));color:var(--t1);font-weight:600}
.mx td .g{color:var(--sc);margin-right:6px;font-weight:700}
.mx td.na{color:var(--t3);background:transparent;cursor:default}
.mx td.na:hover{outline:0}

.tl{flex:1;min-height:0;position:relative}
.tl svg{position:absolute;inset:0;width:100%;height:100%}
.tl.clk{cursor:zoom-in}
.tl.clk:hover{background:color-mix(in srgb,var(--hov) 40%,transparent)}
.tlbig{flex:none;height:520px;display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:4px;padding:8px 6px 6px}
.tlbig .tl{flex:1}
.tlbig .tlp{font-size:14px;color:var(--t2);padding:0 8px 6px}
#ovlB>.h24t,#ovlB>.ank{flex:none}
.proj{font-size:14px;border:1px dashed var(--t2);color:var(--t2);padding:1px 6px;border-radius:3px;font-weight:500;white-space:nowrap}
.ltf{flex:1;min-height:0;width:100%;border:0;border-top:1px solid var(--bd);background:#f7f7f7}

/* distribución · fase 1 */
.fun{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 14px 10px}
.fr{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px;color:var(--t2)}
.fr .fb{height:20px;background:var(--band3);position:relative}
.fr .fb i{position:absolute;left:0;top:0;bottom:0;background:var(--t3)}
.fr .v{color:var(--t1);font-weight:700;text-align:right;font-size:16px}
.fl{padding-left:160px;font-size:14px;color:var(--t2)}
.fl.s-warn,.fl.s-crit{color:var(--sc);font-weight:700}
.aj{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px;padding:0 12px 10px}
.ajc{background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.ajc b{font-size:30px;line-height:1;font-weight:700;color:var(--t1)}
.ajc span{font-size:14px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ajc:not(.s-ok){border-color:var(--sc)} .ajc:not(.s-ok) b{color:var(--sc)}
.ajc[data-drill]{cursor:pointer} .ajc[data-drill]:hover{background:var(--hov)}
.cols{flex:1;min-height:0;display:flex;gap:6px;padding:6px 14px 8px;position:relative}
.cb{flex:1;min-width:0;display:flex;flex-direction:column}

/* estado del troncal: despachado o no */
const trcEst=l=>{const [t,c,tip]=l.sr==='—'?['Sin despachar','crit','Todavía no salió: no tiene hora de salida real']:l.dv.startsWith('Arribada')?['Arribado','done','Ya llegó a destino']:l.dv.startsWith('Detenida')?['Despachado · detenido','warn','Salió y está detenido en ruta']:['Despachado · en viaje','ok','Salió y está en viaje'];return `<span class="trce trce-${c}" title="${tip}">${t}</span>`};
/* matriz sucursal × proceso */
function cell(id,col){
  const n=ND[id],ex=o=>openE().filter(e=>e.node===id&&TABS.find(t=>t.id===o).ops.includes(e.op));
  if(col==='dist'){if(n.sla==null)return null;const s=worst([lvl(n.sla,{tg:95,th:93,dir:1}),exState(ex('dist'))]);return {s,t:`SLA ${f1(n.sla)}%`}}
  if(col==='tro'){
    if(id==='adu')return null;
    if(id==='sol'){const out=LN.filter(l=>l.a==='sol'),bad=out.filter(l=>laneState(l.id)!=='ok');return {s:worst(out.map(l=>laneState(l.id))),t:bad.length?`${bad.length}/${out.length} con desvío`:`${out.length} salidas OK`}}
    const ls=LN.filter(x=>x.st.slice(1).includes(id));if(!ls.length)return null;const l=ls.slice().sort((p,q)=>SEV[laneState(q.id)]-SEV[laneState(p.id)])[0],s=laneState(l.id);return {s,t:ls.length>1&&s==='ok'?`${ls.length} troncales`:l.dv,d:'lane:'+l.id};
  }
  if(col==='cd'){const c=CDX[id];if(!c)return null;const s=worst([lvl(c.desp/c.rec*100,{tg:95,th:90,dir:1}),exState(ex('cd'))]);return {s,t:`${fi(c.desp)} de ${fi(c.rec)}`}}
  if(col==='cbt'){
    if(id==='adu')return isStale('adu')?{s:'stale',t:`Sin datos ${Math.floor(srcAge('adu'))}′`}:{s:exState(ex('cbt')),t:'En línea'};
    if(n.cbt==null)return null;const s=worst([lvl(n.cbt,{tg:95,th:93,dir:1}),exState(ex('cbt'))]);return {s,t:`SLA ${f1(n.cbt)}%`};
  }
}

/* importar la planilla (CSV de la Google Sheet) y exportar */
function parseCSV(txt){txt=txt.replace(/^﻿/,'');const first=txt.split(/\r?\n/)[0]||'',dl=[';','\t',','].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0],rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}else if(ch==='"')q=true;else if(ch===dl){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()))}
function bitImportar(txt){const rows=parseCSV(txt);if(rows.length<2)throw new Error('El CSV está vacío.');
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,''),head=rows[0].map(norm),col={};COLS_SHEET.forEach(([k,t])=>{const i=head.indexOf(norm(t));col[k]=i});
  if(col.motivo<0||col.fecha<0)throw new Error('El CSV no tiene las columnas de la bitácora (Fecha y Motivo de Desvío como mínimo).');
  const ex=new Set(E.filter(e=>e.raw).map(e=>[e.raw.fecha,String(e.raw.cliente||'').toLowerCase(),String(e.raw.motivo||'').toLowerCase()].join('|'))),lim=new Date(TODAY0-864e5);let nuevos=0,rep=0,inv=0;
  rows.slice(1).forEach(r=>{const g=k=>col[k]>=0?String(r[col[k]]||'').trim():'',m=/^\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(g('fecha'));if(!m||!g('motivo')){inv++;return}
    const y=+m[3]<100?2000+ +m[3]:+m[3],fecha=`${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`,key=[fecha,g('cliente').toLowerCase(),g('motivo').toLowerCase()].join('|');if(ex.has(key)){rep++;return}
    const abierto=new Date(fecha+'T00:00')>=lim,t=isoL(now());BIT.seq++;
    E.push(itemAE({fecha,semana:semanaDe(fecha),cliente:g('cliente'),envios:parseInt(g('envios').replace(/\D/g,'')||'0',10),motivo:g('motivo'),tipo:g('tipo').toUpperCase(),accion:g('accion'),cargado_por:g('cargado_por')||'Planilla',prioridad:3,proceso:'',zona:'',suc:'',
      estado:abierto?'reconocida':'cerrada',dueno:'Sin asignar',escalada:false,vence:null,causa:abierto?null:'Importado de la planilla',id:'D-'+String(BIT.seq).padStart(4,'0'),creado:t,actualizado:t,log:[{t,x:`Importado de la Google Sheet por ${g('cargado_por')||'Planilla'}`}]}));
    ex.add(key);nuevos++});
  return {nuevos,rep,inv}}
function saveFile(name,text,okMsg){const blob=new Blob([text],{type:'text/csv;charset=utf-8'});
  if(window.claude&&window.claude.use){window.claude.use('downloads').then(dl=>{if(!dl){toast('La descarga no está disponible en esta vista');return}return dl.save({filename:name,data:blob}).then(()=>toast(okMsg),e=>{if(e&&e.code!=='declined')toast('No se pudo exportar: '+(e.message||e.code))})}).catch(()=>toast('No se pudo exportar'));return}
  try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast(okMsg)}catch(e){toast('No se pudo exportar desde este navegador')}}
function bitExportar(){const items=E.filter(e=>e.raw).map(e=>e.user?aeItem(e):{...e.raw,id:e.id,prioridad:e.p,estado:e.st,dueno:e.owner,escalada:!!e.esc,vence:isoL(e.due),causa:e.causa||null,creado:isoL(e.at),actualizado:isoL(now())})
    .sort((a,b)=>(a.fecha+a.creado).localeCompare(b.fecha+b.creado)),q=v=>{const s=String(v??'');return /[,"\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s},C=[...COLS_SHEET,...COLS_TORRE];
  const csv='﻿'+[C.map(c=>c[1]).join(','),...items.map(i=>C.map(([k])=>q(k==='fecha'?i.fecha.split('-').reverse().join('/'):k==='escalada'?(i.escalada?'Sí':'No'):k==='prioridad'?'P'+i.prioridad:k==='suc'?(ND[i.suc]?ND[i.suc].n:i.suc):i[k])).join(','))].join('\r\n');
  saveFile(`bitacora_desvios_${hoyISO()}.csv`,csv,`Bitácora exportada · ${items.length} desvíos`)}

    case 'insz':{const z=clamp(S.insz+(+id||0),0,4);if(z===S.insz)return;S.insz=z;try{localStorage.setItem('tc_insz',z)}catch(e){}if(window.d3)drawMap();toast(z?`Recuadro AMBA · tamaño ${z} de 4`:'Recuadro AMBA minimizado · + lo vuelve a abrir');return}
    case 'nohead':S.nohead=!S.nohead;try{localStorage.setItem('tc_nohead',S.nohead?'1':'0')}catch(e){}if(S.solo){S.soloKey='';renderSolo()}else{S.gkey='';renderAll()}toast(S.nohead?'Encabezado oculto · ▭ lo vuelve a mostrar':'Encabezado visible');return;
    case 'mfclear':S.sel=null;setF({zona:'Todas',prov:'Todas',suc:'Todas'},'Filtros quitados · todo el país');return;
    case 'piMin':S.piMin=!S.piMin;try{localStorage.setItem('tc_pimin',S.piMin?'1':'0')}catch(e){}{const p=$('#pinfo');if(p)p.dataset.k=''}if(window.d3)drawMap();toast(S.piMin?'Panel minimizado · tocá el título o ▲ para desplegarlo':'Panel desplegado');return;
    case 'piMore':S.piOpen=!S.piOpen;{const p=$('#pinfo');if(p){p.dataset.k='';}}if(window.d3)drawMap();return;
    case 'openSel':if(S.sel)openDrill(S.sel.t,S.sel.id);else if(S.f.suc!=='Todas')openDrill('node',S.f.suc);return;
    case 'clearSel':if(S.sel){S.sel=null;renderAll();toast('Selección quitada')}else setF({suc:'Todas'},'Selección quitada');return;
    case 'mzoom':if(id==='0')mzSet(1,null);else if(MZ)mzAt(S.mz.k*(+id>0?1.5:1/1.5),MZ.m);return;
    case 'solo':enterSolo(id);return;
    case 'wmv':case 'wsz':{const [wid,dx,dy]=String(id).split('|'),it=S.edit&&S.edit.items.find(x=>x.id===wid);if(!it)return;const mn=wInfo(wid).min,r=a==='wmv'?{x:it.x+ +dx,y:it.y+ +dy,w:it.w,h:it.h}:{x:it.x,y:it.y,w:it.w+ +dx,h:it.h+ +dy};
      if(r.x<0||r.y<0||r.x+r.w>GC||r.y+r.h>GR){toast('Llegó al borde de la pantalla');return}if(r.w<mn[0]||r.h<mn[1]){toast('Es el tamaño mínimo de este elemento');return}if(S.edit.items.some(o=>o!==it&&hit(r,o))){toast('Hay otro elemento en ese lugar');return}Object.assign(it,r);renderAll();return}
    case 'wdesel':if(S.edit)S.edit.sel=null;renderAll();return;
    case 'unsolo':exitSolo();return;
    case 'fs':goFs(!document.fullscreenElement);return;
    case 'xf':S.xf=id;renderAll();return;
    case 'heat':S.heat=id;saveHeat();layersRefresh();return;
    case 'desv':S.desv=id;S.heat='desv';saveHeat();layersRefresh();return;
    case 'p':if($('#pop').classList.contains('on')&&$('#pop').dataset.id===id){closePop();return}$('#pop').dataset.id=id;openPop(el,id);return;
    case 'params':closePop();openDrill('params');return;
    case 'circP':S.circP=id;renderAll();return;
    case 'h24csv':{const D=h24Data(id),nm=id==='neh'?'no_entregados':'visitadas',hd=id==='neh'?'hora;estado;hoy;semana_pasada':'hora;estado;visitadas;ritmo_necesario';
      const csv=[hd,...D.map((d,i)=>[d.h+':00',i>CUR?(id==='neh'?'sin dato':'proyeccion'):i===CUR?'en curso':'real',d.v==null?'':d.v,d.r].join(';'))].join('\n');saveFile(`${nm}_por_hora_24h_${hoyISO()}.csv`,'\ufeff'+csv,'CSV de las 24 h descargado');return}
    case 'circA':openOvl('circ');return;
    case 'vde':S.vde=!S.vde;renderAll();return;
    case 'ovl':{const [k,b]=String(id).split(':');openOvl(k,b||null,el.dataset.pre?JSON.parse(el.dataset.pre):null);return}
    case 'omore':{const o=S.ovl,top=$('.otw')?$('.otw').scrollTop:0;o.lim=id==='all'?1e9:o.lim+100;renderOvlTable();const w=$('.otw');if(w)w.scrollTop=top;return}
    case 'ob':S.ovl.f.b=S.ovl.f.b===String(id)?'':String(id);renderOvlTable();return;
    case 'osort':{const s=S.ovl.sort;if(s.k===id)s.d=-s.d;else{s.k=id;s.d=id==='ant'||id==='fv'?-1:1}renderOvlTable();return}
    case 'ofclear':{const D=DS[S.ovl.kind],f={q:'',desde:'',hasta:'',b:''};D.filters.forEach(([k])=>f[k]='');Object.assign(f,D.fixed||{});S.ovl.f=f;renderOvl();return}
    case 'oback':{const p=S.ovl.prev;if(p){S.ovl=p;renderOvl()}return}
    case 'motst':openOvl('motst',null,{mot:id});return;
    case 'sbm':S.ovl.f.b=id;renderOvl();return;
    case 'sbc':S.ovl.f.cpt=id||'';renderOvl();return;
    case 'motsel':S.ovl.f.mot=id;renderOvl();return;
    case 'csv':exportCsv();return;
    case 'clearF':S.f={...FDEF};S.sel=null;renderAll();return;
  }
  renderAll();
}
document.addEventListener('click',ev=>{
  const a=ev.target.closest('[data-act]');
  if(!ev.target.closest('.pop')&&!(a&&a.dataset.act==='p'))closePop();
  if(a){ev.stopPropagation();if(a.disabled)return;if(!a.closest('.menu')&&a.dataset.act!=='layers')closeMenu();act(a.dataset.act,a.dataset.id,a);return}
  if(!ev.target.closest('.menu'))closeMenu();
  const d=ev.target.closest('[data-drill]');
  if(d){const [t,...r]=d.dataset.drill.split(':');pick(t,r.join(':'),d)}
});
/* controles dentro de las tarjetas y filtros de la ventana de detalle */
document.addEventListener('change',e=>{const t=e.target;if(t.matches('select[data-chg]')){S[t.dataset.chg]=t.value;renderAll()}else if(t.matches('[data-of]')&&S.ovl){S.ovl.f[t.dataset.of]=t.value;renderOvlTable()}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('input[data-of]')&&S.ovl){S.ovl.f[t.dataset.of]=t.value;renderOvlTable()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.solo){if(!document.fullscreenElement)exitSolo();return}if(e.key==='Escape'){closeMenu();closePop();if(S.ovl){closeOvl();return}closeDrill();closeDlg()}else if(e.key==='Enter'&&stage.classList.contains('dlgopen')){e.preventDefault();act('dlgSave')}});
document.querySelectorAll('.fil .fchip select').forEach(s=>s.addEventListener('change',()=>{const k=s.dataset.key,v=s.value;if(k!=='cli')S.sel=null;
  if(k==='zona')setF({zona:v,prov:'Todas',suc:'Todas'});else if(k==='prov')setF({prov:v,suc:'Todas',zona:v==='Todas'?S.f.zona:provZona(v,S.f.zona)});else setF({[k]:v})}));
$('#fLay').addEventListener('change',e=>{LS.active=e.target.value;saveLS();renderAll();toast(`Disposición: ${LS.active}`)});
$('#dlgName').addEventListener('input',dlgCheck);

/* ciclo */
function renderAll(){saveBit();syncScope();setTimeout(colsScroll,0);if(S.solo){renderSolo();return}document.body.classList.toggle('nohead',!!S.nohead&&curLayout().some(i=>i.id==='map'));renderTop();renderFil();renderGrid();if(S.drill)renderDrill()}
function tick(){
  fit();const t=now();$('#clock').textContent=hms(t);const sc=$('#sclock');if(sc)sc.textContent=hms(t);
  if(S.solo==='exc'&&S.xPages>1&&Math.floor(Date.now()/1000)%12===0){S.xPage=(S.xPage+1)%S.xPages;xShow()}
  document.querySelectorAll('[data-since]').forEach(el=>el.textContent=dur(t-+el.dataset.since));
  document.querySelectorAll('[data-due]').forEach(el=>el.textContent=dmin((+el.dataset.due-t)/60000));
  document.querySelectorAll('[data-cd]').forEach(el=>el.textContent=hmsLeft(+el.dataset.cd-t));
  const nx=Math.max(0,45-Math.floor((t-S.lastRef)/1000));
  $('#refresh').innerHTML=`Actualizado <b>${hms(S.lastRef)}</b> · próximo en ${nx} s`;
  if(nx===0)refresh();
}
const jit=(v,a)=>Math.round((v+(Math.random()-.5)*a)*10)/10;
function refresh(){
  S.lastRef=now();SRC.forEach(s=>{if(!s.frozen)s.last=now()-Math.random()*20000});
  K.sla.v=jit(K.sla.v,.2);K.fpa.v=jit(K.fpa.v,.2);K.bl.seg[0]=Math.round(K.bl.seg[0]+(Math.random()-.4)*120);
  [K.sla,K.fpa,K.bl].forEach(k=>k.sp[8]=kBase(k));
  renderAll();
}
function injectP1(){
  const e={...NEWP1,at:now(),due:now()+NEWP1.left*60000,pulseUntil:Date.now()+1900,log:[{t:now(),x:'Detectada por GPS: unidad detenida > 20 min'}]};e.raw=demoRaw(e);E.push(e);
  clog(`${e.id} · Nueva P1: ${e.t}`);if(S.cont)autoEsc();
  const l=LN.find(x=>x.id==='ros');l.dv='Detenida en RN 9';

}
let lastW=0,lastH=0;
function fit(){const w=innerWidth,h=innerHeight;if(!w||!h||(w===lastW&&h===lastH))return;const s=Math.min(w/1920,h/1080);window.__s=s;stage.style.transform=`translate(${(w-1920*s)/2}px,${(h-1080*s)/2}px) scale(${s})`;

try{const q=new URLSearchParams(location.search);if(TABS.find(t=>t.id===q.get('tab')))S.tab=q.get('tab');if(q.get('modo')==='pared'){S.wall=true;stage.classList.add('wall');$('#bPared').classList.add('on');$('#bPuesto').classList.remove('on')}
  if(q.get('tema')==='claro'||q.get('tema')==='oscuro')S.theme=q.get('tema')==='claro'?'light':'dark'}catch(e){}
document.documentElement.dataset.theme=S.theme;
$('#logo').src=S.theme==='dark'?'assets/logo_ocasa_blanco.png':'assets/logo_ocasa.png';
document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.id===S.theme));
pal();
(function poll(){fit();if(!lastW)requestAnimationFrame(poll)})();
loadBit();troCalc();renderAll();tick();setInterval(tick,1000);
try{const qs=new URLSearchParams(location.search),so=qs.get('solo'),gi=+qs.get('giro');if([90,180,270].includes(gi))S.rot=gi;else if(qs.has('giro'))S.rot=0;if(so==='mapa'||so==='excepciones')enterSolo(so==='mapa'?'mapa':'exc');else if(qs.get('pantalla')==='vertical')enterSolo('mapa')}catch(e){}addEventListener('resize',fit);
document.fonts&&document.fonts.ready.then(()=>renderGrid());

fetch('countries-110m.json').then(r=>r.json()).then(t=>{TOPO=t;drawMap()}).catch(()=>drawMap());
